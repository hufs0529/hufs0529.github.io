- id: spark-workflow-builder
  title: Spark · Kubernetes 기반 드래그 앤 드롭 데이터 분석 워크플로우 도구
  summary: >-
    Hadoop 기반 빅데이터 Hub 플랫폼의 분석 도구로, 사용자가 드래그 앤 드롭으로 데이터 처리 흐름을 만들고
    Spark 로 실행하는 서비스를 3인 팀(팀장 1 · 개발 2)에서 개발했습니다. 샘플 Parquet 사전 검증,
    단계별 디스크 저장으로 OOM 해결, 비동기 실행과 진행도·취소, Airflow 디스크 관리를 맡았습니다.
  period: 2024.01 – 2024.07 (7개월)
  role: 데이터 엔지니어 · 개발 2인 중 1명 (팀장은 설계·코드 리뷰)
  status: 완료
  featured: true
  cover: /assets/img/portfolio/spark-workflow-builder/cover.svg
  stack: [Apache Spark, Kubernetes, Airflow, Parquet, Hadoop(HDFS), Spark REST API]
  highlights:
    - 샘플 Parquet + Spark 로 워크플로우 설정 단계에서 오류·정합성 사전 판단
    - 수십 단계 · 대용량 워크플로우의 OOM 을 단계별 디스크 저장으로 해결 (속도 ↔ 안정성 trade-off)
    - Spark REST API 진행도, 동시 실행 제한, SIGTERM 기반 취소
    - Airflow 로 디스크 사용량 알림과 UI 에서 실행하는 수동 정리
    - 프론트엔드 팀과 시각화 방식 · 데이터 포맷 계약 협의
  repo: https://github.com/hufs0529/spark-workflow-builder

- id: fl-peft-quantization
  title: 연합학습에서 양자화와 데이터 이질성은 서로를 악화시키는가 — QLoRA × non-IID 24조합 실험
  summary: >-
    Macquarie University STEM Research Placement(6주) 연구. 연합 LoRA 파인튜닝에서 base 모델 양자화(bf16 · INT8 · NF4)와
    클라이언트 데이터 이질성(Dirichlet α 0.1 ~ 100)이 상호작용하는지 24조합 전수 실험으로 검증했습니다.
    결론은 "더해지기만 한다" — 그리고 그 null 결과가 왜 설계의 귀결이었는지까지 진단했습니다.
  period: 2026.08 – 2026.09 (6주)
  role: 1인 연구 · 설계 · 구현 · 실험 · 분석 (지도교수 피드백)
  status: 완료
  featured: true
  cover: /assets/img/portfolio/fl-peft-quantization/cover.svg
  stack: [PyTorch, Flower, PEFT(LoRA · QLoRA), bitsandbytes, Transformers, Qwen2.5-0.5B, Dolly-15k]
  highlights:
    - 3 압축 × 2 FL 알고리즘 × 4 α = 24조합 전수 요인 설계, 33.7 GPU-시간
    - 압축 페널티의 α 변동폭 0.37%p — 상호작용 0.2% (F=0.15), 가설 기각
    - INT8 은 품질 손실 없이 라운드당 2.19배 느림, 양자화는 통신량을 줄이지 않음
    - NaN 손실 · 조용한 결과 누락 · 환경 혼입을 찾아 고치고 66개 테스트로 고정
    - null 결과를 설계 진단(드리프트 최소 설정, 측정 부재, 구성 타당도)으로 회고
  repo: https://github.com/hufs0529/peft_fl_STEM_placement

- id: fl-rag-rerank
  title: 검색 연산으로 통신을 되살 수 있는가 — 연합 LLM 파인튜닝에서 리랭킹의 교환비
  summary: >-
    Macquarie University STEM Research Placement(6주) 두 번째 연구. 연합 RAG 파인튜닝에서 클라이언트 측
    리랭킹 깊이를 높이면 목표 정확도까지의 라운드(= 통신 바이트)가 줄어드는지, 그 교환비를 24개 실행으로 측정했습니다.
    처리는 의도대로 작동했지만 학습은 따라오지 않았고, 인과 사슬이 끊어진 고리를 찾아냈습니다.
  period: 2026.09 – 2026.10 (6주)
  role: 1인 연구 · 설계 · 구현 · 실험 · 분석 (멘토 피드백)
  status: 완료
  featured: true
  cover: /assets/img/portfolio/fl-rag-rerank/cover.svg
  stack: [Flower, PyTorch, PEFT(LoRA), SmolLM2-135M, Qdrant, bge-small, Cross-encoder, Natural Questions]
  highlights:
    - 처리 축 하나(리랭킹 깊이 d)만 바꾸고 통신 예산 1.74 GB 를 모든 실행에 고정, d=3 순서 통제군
    - 파일럿 게이트 3개(성능 여유 · 처리 단조성 · 로컬 스텝 보정)로 null 결과의 해석 가능성 확보
    - 목표 정확도를 고르지 않고 63개 τ 를 훑어 라운드 절감을 곡선으로 보고
    - 교환비 10개 중 8개 음수, 클라이언트 업데이트 발산은 0.77% 만 움직임 → 끊어진 고리 특정
    - 설계 약속을 테스트 333개와 코드로 강제, 통계 규칙 오류(t=3.182)를 스스로 찾아 정정
  repo: https://github.com/hufs0529/rag_fl_STEM_placement

