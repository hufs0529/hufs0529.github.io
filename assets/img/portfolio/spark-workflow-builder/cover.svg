<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Pretendard, 'Noto Sans KR', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">드래그 앤 드롭 데이터 분석 워크플로우 — Spark · Kubernetes · Airflow</text>
  <text x="600" y="94" text-anchor="middle" font-size="18" fill="#475569">Hadoop 기반 빅데이터 Hub 플랫폼 분석 도구 · 2024.01 – 2024.07 · 3인 팀</text>

  <!-- workflow canvas -->
  <rect x="40" y="130" width="1120" height="150" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="162" font-size="17" font-weight="700" fill="#475569">워크플로우 캔버스 (UI)</text>
  <g font-size="16" font-weight="600" text-anchor="middle">
    <rect x="80" y="185" width="170" height="64" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="165" y="223" fill="#075985">데이터 선택</text>
    <rect x="300" y="185" width="170" height="64" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="385" y="223" fill="#075985">중복 처리</text>
    <rect x="520" y="185" width="170" height="64" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="605" y="223" fill="#075985">타입 변환</text>
    <rect x="740" y="185" width="170" height="64" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="825" y="223" fill="#075985">데이터 수정</text>
    <rect x="960" y="185" width="170" height="64" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/><text x="1045" y="223" fill="#334155">… 수십 단계</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#ar)">
    <line x1="250" y1="217" x2="298" y2="217"/><line x1="470" y1="217" x2="518" y2="217"/>
    <line x1="690" y1="217" x2="738" y2="217"/><line x1="910" y1="217" x2="958" y2="217"/>
  </g>

  <!-- lower boxes -->
  <rect x="40" y="320" width="350" height="270" rx="16" fill="#ecfdf5" stroke="#059669"/>
  <text x="215" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#065f46">① 설정 중 사전 검증</text>
  <text x="215" y="400" text-anchor="middle" font-size="16" fill="#065f46">샘플 Parquet + Spark</text>
  <text x="215" y="430" text-anchor="middle" font-size="16" fill="#065f46">스키마 · 타입 · 오류를</text>
  <text x="215" y="460" text-anchor="middle" font-size="16" fill="#065f46">spark-submit 전에 즉시 확인</text>
  <text x="215" y="530" text-anchor="middle" font-size="15" fill="#047857">긴 제출 → 실패 → 재시도 낭비 제거</text>

  <rect x="425" y="320" width="350" height="270" rx="16" fill="#fff7ed" stroke="#ea580c"/>
  <text x="600" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">② 단계별 디스크 저장</text>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="455" y="385" width="80" height="40" rx="8" fill="#fff" stroke="#ea580c"/><text x="495" y="410" fill="#9a3412">step 1</text>
    <rect x="560" y="385" width="80" height="40" rx="8" fill="#fff" stroke="#ea580c"/><text x="600" y="410" fill="#9a3412">step 2</text>
    <rect x="665" y="385" width="80" height="40" rx="8" fill="#fff" stroke="#ea580c"/><text x="705" y="410" fill="#9a3412">step N</text>
    <rect x="455" y="455" width="290" height="40" rx="8" fill="#ffedd5" stroke="#ea580c"/><text x="600" y="480" fill="#9a3412">Parquet (단계별 중간 결과)</text>
  </g>
  <g stroke="#ea580c" stroke-width="2" marker-end="url(#ar)"><line x1="495" y1="425" x2="495" y2="453"/><line x1="600" y1="425" x2="600" y2="453"/><line x1="705" y1="425" x2="705" y2="453"/></g>
  <text x="600" y="530" text-anchor="middle" font-size="15" fill="#9a3412">OOM 방지 · 며칠 뒤 다시 확인</text>
  <text x="600" y="556" text-anchor="middle" font-size="15" fill="#9a3412">Airflow 디스크 알림 · 수동 정리</text>

  <rect x="810" y="320" width="350" height="270" rx="16" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="985" y="356" text-anchor="middle" font-size="19" font-weight="700" fill="#3730a3">③ 최종 실행 on Kubernetes</text>
  <text x="985" y="400" text-anchor="middle" font-size="16" fill="#3730a3">비동기 spark-submit</text>
  <text x="985" y="430" text-anchor="middle" font-size="16" fill="#3730a3">Spark REST API 진행도</text>
  <text x="985" y="460" text-anchor="middle" font-size="16" fill="#3730a3">동시 실행 제한 (OOM 방지)</text>
  <text x="985" y="490" text-anchor="middle" font-size="16" fill="#3730a3">SIGTERM 으로 안전한 취소</text>
  <text x="985" y="530" text-anchor="middle" font-size="15" fill="#4338ca">UI 에서 기다리지 않아도 되는 실행</text>
</svg>
